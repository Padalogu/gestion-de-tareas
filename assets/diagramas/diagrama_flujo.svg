  <path d="M 1105 565 L 1105 601" fill="none" stroke="#1d2d4b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 960 628 L 805 628" fill="none" stroke="#1d2d4b" stroke-width="2" marker-end="url(#arrow)"/>
