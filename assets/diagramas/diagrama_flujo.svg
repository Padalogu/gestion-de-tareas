<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="840" viewBox="0 0 1320 840">
  <defs>
    <style>
      text { font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #1d2d4b; }
      .subtitle { font-size: 13px; fill: #526078; }
      .lane-title { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .node-text { font-size: 13px; font-weight: 600; fill: #17233b; }
      .node-sub { font-size: 11px; fill: #4a5871; }
      .node-white { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .edge-label { font-size: 11.5px; font-weight: 700; fill: #1d2d4b; }
      .stereo { font-size: 11px; font-style: italic; fill: #4a5871; }
      .cls-name { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .cls-item { font-size: 11.5px; fill: #17233b; font-family: "DejaVu Sans Mono", monospace; }
      .actor-lbl { font-size: 14px; font-weight: 700; fill: #1d2d4b; }
      .uc-text { font-size: 13px; font-weight: 600; fill: #17233b; }
      .seq-lbl { font-size: 12px; font-weight: 600; fill: #17233b; }
      .seq-head { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1d2d4b"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#4a5871"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#1d2d4b" stroke-width="1.6"/>
    </marker>
    <marker id="inherit" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#ffffff" stroke="#1d2d4b" stroke-width="1.6"/>
    </marker>
    <marker id="comp-start" viewBox="0 0 16 12" refX="1" refY="6" markerWidth="14" markerHeight="10" orient="auto">
      <path d="M 1 6 L 8 1 L 15 6 L 8 11 z" fill="#1d2d4b" stroke="#1d2d4b" stroke-width="1.2"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1d2d4b" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1320" height="840" fill="#ffffff"/>
  <text x="660" y="34" text-anchor="middle" class="title">Diagrama de Flujo del Proceso Principal (con Carriles por Rol)</text>
  <text x="660" y="54" text-anchor="middle" class="subtitle">Validación de acceso, gestión por rol, actualización de estado, bitácora en HistorialTarea y notificaciones</text>
  <rect x="20" y="70" width="390" height="745" fill="#f5f8fd" stroke="#cfd9ea" stroke-width="1.5"/>
  <rect x="410" y="70" width="500" height="745" fill="#ffffff" stroke="#cfd9ea" stroke-width="1.5"/>
  <rect x="910" y="70" width="390" height="745" fill="#f3faf6" stroke="#c8e3d6" stroke-width="1.5"/>
  <rect x="20" y="70" width="390" height="36" fill="#1d2d4b"/>
  <rect x="410" y="70" width="500" height="36" fill="#3158a6"/>
  <rect x="910" y="70" width="390" height="36" fill="#24875f"/>
  <text x="215" y="93" text-anchor="middle" class="lane-title">Responsable</text>
  <text x="660" y="93" text-anchor="middle" class="lane-title">Sistema (Lógica y Persistencia)</text>
  <text x="1105" y="93" text-anchor="middle" class="lane-title">Empleado</text>
  <rect x="600.0" y="122.0" width="120.0" height="36.0" rx="18" fill="#1d2d4b" stroke="#1d2d4b" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="144.0" text-anchor="middle" class="node-white">Inicio</text>

  <rect x="550.0" y="184.0" width="220.0" height="44.0" rx="8" fill="#ffffff" stroke="#3158a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="210.0" text-anchor="middle" class="node-text">Ingresar correo y contraseña</text>

  <rect x="555.0" y="252.0" width="210.0" height="44.0" rx="8" fill="#ffffff" stroke="#3158a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="278.0" text-anchor="middle" class="node-text">Validar credenciales y rol</text>

  <polygon points="660.0,319.0 740.0,355.0 660.0,391.0 580.0,355.0" fill="#edf3ff" stroke="#3158a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="351.5" text-anchor="middle" class="node-text">¿Credenciales</text>
  <text x="660.0" y="366.5" text-anchor="middle" class="node-text">válidas?</text>

  <rect x="416.0" y="331.0" width="128.0" height="48.0" rx="8" fill="#fff4f4" stroke="#c94a4a" stroke-width="2" filter="url(#shadow)"/>
  <text x="480.0" y="351.0" text-anchor="middle" class="node-text">Mostrar error</text>
  <text x="480.0" y="367.0" text-anchor="middle" class="node-text">y reintentar</text>

  <polygon points="660.0,416.0 742.0,452.0 660.0,488.0 578.0,452.0" fill="#edf3ff" stroke="#3158a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="448.5" text-anchor="middle" class="node-text">¿Es</text>
  <text x="660.0" y="463.5" text-anchor="middle" class="node-text">Responsable?</text>

  <rect x="525.0" y="515.0" width="270.0" height="50.0" rx="8" fill="#eef4ff" stroke="#3158a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="536.0" text-anchor="middle" class="node-text">Guardar tarea en BD</text>
  <text x="660.0" y="552.0" text-anchor="middle" class="node-text">y generar notificación</text>

  <rect x="515.0" y="601.0" width="290.0" height="54.0" rx="8" fill="#eef4ff" stroke="#3158a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="624.0" text-anchor="middle" class="node-text">Registrar cambio en HistorialTarea</text>
  <text x="660.0" y="640.0" text-anchor="middle" class="node-text">y notificar al Responsable</text>

  <rect x="530.0" y="688.0" width="260.0" height="48.0" rx="8" fill="#eef4ff" stroke="#3158a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="716.0" text-anchor="middle" class="node-text">Actualizar tablero y métricas</text>

  <rect x="600.0" y="764.0" width="120.0" height="36.0" rx="18" fill="#1d2d4b" stroke="#1d2d4b" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="786.0" text-anchor="middle" class="node-white">Fin</text>

  <rect x="85.0" y="427.0" width="260.0" height="50.0" rx="8" fill="#ffffff" stroke="#1d2d4b" stroke-width="2" filter="url(#shadow)"/>
  <text x="215.0" y="448.0" text-anchor="middle" class="node-text">Registrar, editar o</text>
  <text x="215.0" y="464.0" text-anchor="middle" class="node-text">eliminar tarea</text>

  <rect x="85.0" y="515.0" width="260.0" height="50.0" rx="8" fill="#ffffff" stroke="#1d2d4b" stroke-width="2" filter="url(#shadow)"/>
  <text x="215.0" y="536.0" text-anchor="middle" class="node-text">Asignar empleado,</text>
  <text x="215.0" y="552.0" text-anchor="middle" class="node-text">prioridad y fecha límite</text>

  <rect x="85.0" y="687.0" width="260.0" height="50.0" rx="8" fill="#ffffff" stroke="#1d2d4b" stroke-width="2" filter="url(#shadow)"/>
  <text x="215.0" y="708.0" text-anchor="middle" class="node-text">Consultar avance general</text>
  <text x="215.0" y="724.0" text-anchor="middle" class="node-text">e historial de cambios</text>

  <rect x="970.0" y="515.0" width="270.0" height="50.0" rx="8" fill="#ffffff" stroke="#24875f" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.0" y="536.0" text-anchor="middle" class="node-text">Consultar tareas asignadas</text>
  <text x="1105.0" y="552.0" text-anchor="middle" class="node-text">y notificaciones</text>

  <rect x="960.0" y="601.0" width="290.0" height="54.0" rx="8" fill="#ffffff" stroke="#24875f" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.0" y="624.0" text-anchor="middle" class="node-text">Actualizar estado de tarea</text>
  <text x="1105.0" y="640.0" text-anchor="middle" class="node-text">(Pendiente / En proceso / Terminada)</text>

