  <path d="M 345 712 L 530 712" fill="none" stroke="#1d2d4b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 660 736 L 660 764" fill="none" stroke="#1d2d4b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="544.0" y="332.0" width="36.0" height="20" rx="4" fill="#fff4f4"/>
  <text x="562.0" y="346.0" text-anchor="middle" class="edge-label">No</text>

  <rect x="660.0" y="393.0" width="36.0" height="20" rx="4" fill="#ffffff"/>
  <text x="678.0" y="407.0" text-anchor="middle" class="edge-label">Sí</text>

  <rect x="477.0" y="429.0" width="36.0" height="20" rx="4" fill="#ffffff"/>
  <text x="495.0" y="443.0" text-anchor="middle" class="edge-label">Sí</text>

  <rect x="927.0" y="429.0" width="36.0" height="20" rx="4" fill="#ffffff"/>
  <text x="945.0" y="443.0" text-anchor="middle" class="edge-label">No</text>

