      .seq-head { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1d2d4b"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#4a5871"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#1d2d4b" stroke-width="1.6"/>
    </marker>
    <marker id="inherit" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#ffffff" stroke="#1d2d4b" stroke-width="1.6"/>
    </marker>
    <marker id="comp-start" viewBox="0 0 16 12" refX="1" refY="6" markerWidth="14" markerHeight="10" orient="auto">
      <path d="M 1 6 L 8 1 L 15 6 L 8 11 z" fill="#1d2d4b" stroke="#1d2d4b" stroke-width="1.2"/>
    </marker>
