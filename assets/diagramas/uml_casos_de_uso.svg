<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="840" viewBox="0 0 1360 840">
  <defs>
    <style>
      text { font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #1d2d4b; }
