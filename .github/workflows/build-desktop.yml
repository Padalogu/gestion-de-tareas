name: Compilar ejecutables de escritorio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - descargas/GestionTareas_Python_Desktop.zip
      - .github/workflows/build-desktop.yml

permissions:
  contents: write

jobs:
  build:
    name: Compilar (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: linux
            os: ubuntu-latest
          - target: macos
            os: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías Qt del sistema en Linux
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3

      - name: Extraer paquete fuente de desktop_app
        run: |
          python -c "import zipfile; zipfile.ZipFile('descargas/GestionTareas_Python_Desktop.zip').extractall('build_src')"

      - name: Instalar dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.6.0" "pyinstaller>=6.10"

      - name: Ejecutar pruebas unitarias POO
        run: |
          python -m unittest discover -s build_src/gestion-de-tareas-desktop/desktop_app -v

      - name: Compilar y probar ejecutable Windows x64
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name GestionTareas-Windows-x64 `
            --paths build_src/gestion-de-tareas-desktop/desktop_app `
            build_src/gestion-de-tareas-desktop/desktop_app/main.py
          $env:QT_QPA_PLATFORM = "offscreen"
          $proc = Start-Process -FilePath ".\dist\GestionTareas-Windows-x64.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "Self-test falló con código $($proc.ExitCode)"
            exit $proc.ExitCode
          }
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null
          Copy-Item ".\dist\GestionTareas-Windows-x64.exe" ".\release_assets\GestionTareas-Windows-x64.exe"

      - name: Compilar y probar ejecutable Linux x64
        if: matrix.target == 'linux'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name GestionTareas \
            --paths build_src/gestion-de-tareas-desktop/desktop_app \
            build_src/gestion-de-tareas-desktop/desktop_app/main.py
          QT_QPA_PLATFORM=offscreen ./dist/GestionTareas --self-test | grep -q "SELF_TEST_OK"
          mkdir -p dist_pkg/GestionTareas-Linux-x64 release_assets
          cp ./dist/GestionTareas dist_pkg/GestionTareas-Linux-x64/GestionTareas
          chmod +x dist_pkg/GestionTareas-Linux-x64/GestionTareas
          cat > dist_pkg/GestionTareas-Linux-x64/LEEME_LINUX.txt <<'TXT'
          Sistema de Gestión y Seguimiento de Tareas (UDG Plus) — Ejecutable Linux x64

          Ejecución directa (no requiere Python instalado):
            ./GestionTareas

          Si al descomprimir no tuviera permiso de ejecución:
            chmod +x GestionTareas && ./GestionTareas

          Credenciales de prueba:
            Responsable: responsable@negocio.com / admin123
            Empleados:   emp1@negocio.com .. emp3@negocio.com / emp123
          TXT
          tar -C dist_pkg -czf release_assets/GestionTareas-Linux-x64.tar.gz GestionTareas-Linux-x64

      - name: Compilar y probar aplicación macOS Apple Silicon
        if: matrix.target == 'macos'
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed \
            --name GestionTareas \
            --paths build_src/gestion-de-tareas-desktop/desktop_app \
            build_src/gestion-de-tareas-desktop/desktop_app/main.py
          QT_QPA_PLATFORM=offscreen ./dist/GestionTareas.app/Contents/MacOS/GestionTareas --self-test | grep -q "SELF_TEST_OK"
          mkdir -p release_assets
          ditto -c -k --sequesterRsrc --keepParent dist/GestionTareas.app release_assets/GestionTareas-macOS-AppleSilicon.zip

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: release_assets/*
          if-no-files-found: error

  release:
    name: Publicar GitHub Release v1.0.0
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos compilados
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generar sumas SHA-256
        working-directory: release_assets
        run: sha256sum GestionTareas-* > SHA256SUMS.txt

      - name: Crear o actualizar Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh release_assets/
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 release_assets/* --repo "${{ github.repository }}" --clobber
          else
            gh release create v1.0.0 release_assets/* \
              --repo "${{ github.repository }}" \
              --title "v1.0.0 — Ejecutables de escritorio (Windows, Linux y macOS)" \
              --notes "Ejecutables independientes compilados con PyInstaller (Python + PySide6 + SQLite, sin necesidad de instalar Python): Windows x64 (.exe), Linux x64 (.tar.gz) y macOS Apple Silicon (.app.zip)."
          fi
